<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            cursor: none;
        }

        body {

            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            position: absolute;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: lightblue;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: none;
            font-size: 16px;
        }



        .resultado {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        img {
            width: 100%;

        }



        #cursor-personalizado {
            position: fixed;
            width: 50px;
            height: 50px;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <img id="cursor-personalizado" src="https://i.redd.it/w6a6775zvp661.gif" alt="Cursor">
    <img src="https://wallpaperaccess.com/full/1237894.jpg">

    <div class="container">
        <h1>Calculadora IMC</h1>

        <div class="campo">
            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso">
        </div>

        <div class="campo">
            <label for="altura">Altura (m)</label>
            <input type="number" id="altura">
        </div>

        
        <button id="calcular">Calcular IMC</button>

        <div class="resultado" id="resultado">
            resultado imc
        </div>
    </div>

    <script>
        document.getElementById("calcular").addEventListener("click", async () => {

            const peso = Number(
                document.getElementById("peso").value
            );

            const altura = Number(
                document.getElementById("altura").value
            );

            try {

                const resposta = await fetch(
                    '/api/calcular',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            peso,
                            altura
                        })
                    }
                );

                const dados = await resposta.json();

                document.getElementById("resultado").innerText = JSON.stringify(dados.data);

            } catch (erro) {
                document.getElementById("resultado").innerText = "Erro ao calcular";
            }

        });

        const cursor = document.getElementById("cursor-personalizado");
        document.addEventListener("mousemove", function (event) {
            cursor.style.left = event.clientX + "px";
            cursor.style.top = event.clientY + "px";
        });



        document.addEventListener("mousemove", (e) => {
            const rastro = document.createElement("div");

            rastro.style.position = "fixed";
            rastro.style.left = e.clientX + "px";
            rastro.style.top = e.clientY + "px";
            rastro.style.width = "20px";
            rastro.style.height = "6px";
            rastro.style.background = "lightblue";
            rastro.style.borderRadius = "999px";
            rastro.style.pointerEvents = "none";
            rastro.style.zIndex = "99998";
            rastro.style.transform = "translate(-50%, -50%)";
            rastro.style.filter = "blur(4px)";
            rastro.style.transition = "opacity 0.4s linear";

            document.body.appendChild(rastro);

            requestAnimationFrame(() => {
                rastro.style.opacity = "0";
            });

            setTimeout(() => {
                rastro.remove();
            }, 400);
        });
    </script>

</body>

</html>
